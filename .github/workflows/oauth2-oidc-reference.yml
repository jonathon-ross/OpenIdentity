name: OpenIdentity OAuth2 OIDC Reference Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  oauth2-oidc-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify OAuth2 OIDC reference integration
        run: python scripts/verify-oauth2-oidc-reference.py
